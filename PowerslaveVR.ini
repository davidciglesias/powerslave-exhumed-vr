[General]
; 0 = proxy is a pure pass-through (no VR)
EnableXR=1

[Render]
; 1 = true stereo 6DOF world rendering during gameplay
Stereo=1
; game units per real meter
WorldScale=64

[Screen]
; flat virtual screen used for menus / phase-2 preview
Distance=2.0
Width=2.4

[Input]
VirtualPad=1
; weapons fire where the right controller points
ControllerAim=1

[Audio]
; game audio goes to the first output device whose name contains this (empty = Windows default)
Device=Steam Streaming Speakers

[Weapon]
; 2D weapon sprite shown as a card in the right hand (0 = classic HUD weapon)
InHand=1
; physical width (m) of the cropped weapon region, and offsets from the controller (m)
Width=0.75
Forward=0.06
Up=-0.12
; voxel extrusion: each sprite pixel block (Voxel = 2D-image pixels per voxel) becomes a
; Thickness (m) deep column along the aim; EdgeShade = side wall brightness
Thickness=0.04
Voxel=8
EdgeShade=0.65
; part of the 2D screen (0..1) where the game draws the weapon
CropX0=0.0
CropX1=1.0
CropY0=0.25
CropY1=1.0

[Hud]
; HUD and in-game menus on a head-locked transparent layer (meters)
Overlay=1
Distance=1.2
Width=1.2
Down=-0.04
; status bar strip (canvas from Split to bottom) on its own panel, BarPitch degrees below gaze
Split=0.70
BarWidth=0
BarPitch=30
BarDistance=1.0
; HUD canvas aspect (0 = as rendered); menus get their own square panel
Aspect=0
MenuWidth=1.2
; pickup/notification messages: band of the HUD image (MsgY0..MsgY1) shown MsgPitch deg below the gaze
MsgY0=0.15
MsgY1=0.32
MsgPitch=12

[Hand]
; left hand on the left controller, cut once out of a weapon's 2D image (SourceWeapon 6 =
; the ring: its left hand) the first time that weapon is held ~1.5 s, then saved to
; PowerslaveVR_hand.raw (delete that file to capture again). Src = crop of the 2048 image.
Enable=0
SourceWeapon=6
SrcX0=0.0
SrcX1=0.2813
SrcY0=0.5874
SrcY1=0.8252
; physical width (m), offsets from the controller (m), voxel depth (m), flip horizontally
Width=0.16
Forward=0.0
Up=-0.08
Thickness=0.03
Mirror=0

[Gauges]
; chest panel: health, ammo, air (underwater), seen by looking down. Width (m); Down/Forward (m)
; from the head; Tilt (deg, 0 = upright, 90 = lying flat); it turns with you once the head is
; more than Deadzone (deg) to one side
Enable=1
Width=0.22
Down=0.45
Forward=0.30
Tilt=50
Deadzone=25
; power/compass icon (crop of the HUD image, 0..1) shown right of the bars, IconSize (m, 0 = off)
IconX0=0.76
IconX1=0.94
IconY0=0.0
IconY1=0.13
IconSize=0.07

[Debug]
; 1 = headset-free test harness: no OpenXR, head/hands/pad driven by Script (see src/xr/fake_xr.cpp)
FakeXR=0
Script=PowerslaveVR_test.txt
; seconds between automatic invariant checks in the log (0 = only the script's `check` lines)
CheckEvery=0
; 1 = write the HUD/menu layers as raw RGBA dumps into the game folder (diagnostics, 16 MB each)
DumpLayers=0
